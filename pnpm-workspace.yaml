packages:
  - 'packages/*'

overrides:
  '@vitejs/plugin-react': '^5.0.0'
  shell-quote: '>=1.8.5'
  tmp: '>=0.2.6'
  adm-zip: '^0.6.1'
  # fast-uri: only major 4 is present in the tree today. Scoped to that major
  # (not a blanket floor) so a future major-1/2/3 consumer doesn't get forced
  # onto 4.x — the same class of bug that took down ESLint via brace-expansion.
  fast-uri@4: '^4.1.3'
  browserslist: '^4.28.7'
  sharp: '^0.35.4'
  js-yaml@4: '^4.3.2'
  # brace-expansion is pinned to the PATCHED release of each major line, NOT to a
  # single blanket floor. A blanket `brace-expansion: '>=2.1.3'` forces v5 onto
  # every edge — including minimatch@3.1.5, which declares `^1.1.7` and calls the
  # v1 API. v5's export shape differs, so ESLint died repo-wide with
  # "TypeError: expand is not a function" in Minimatch.braceExpand, before it
  # reached a single file. @eslint/config-array still depends on minimatch v3, so
  # that edge cannot be avoided until ESLint moves off it.
  # 1.1.17 / 2.1.3 / 5.0.8 are the fixed releases per line — the same set already
  # allow-listed in minimumReleaseAgeExclude below.
  # NOTE THE UPPER BOUNDS. `>=1.1.17` looks right but is unbounded, so pnpm
  # resolves it to the highest matching version — v5 — which is exactly the bug
  # this is fixing. `^` keeps each edge inside its own major.
  brace-expansion@1: '^1.1.17'
  brace-expansion@2: '^2.1.3'
  brace-expansion@5: '^5.0.8'
  undici: '>=7.29.0'
  nanoid@^5.0.0: '>=5.1.16'
  uuid: '>=11.1.1'
allowBuilds:
  '@sentry/cli': false
  '@swc/core': true
  cbor-extract: true
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  spawn-sync: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - uuid@11.1.1
  - shell-quote@1.8.4 || 1.8.5
  - tmp@0.2.6
  - esbuild@0.28.1
  - adm-zip@0.6.0 || 0.6.1
  - fast-uri@3.1.4 || 3.1.5 || 4.1.3
  - browserslist@4.28.7
  - sharp@0.35.0 || 0.35.4
  - next@16.2.11 || 16.3.3
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - undici@6.28.0 || 7.29.0
  - js-yaml@4.3.1 || 4.3.2
  - dompurify@3.4.13
  - nanoid@3.3.17 || 5.1.16
