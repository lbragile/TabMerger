packages:
  - 'packages/*'

overrides:
  '@vitejs/plugin-react': '^5.0.0'
  shell-quote: '>=1.8.5'
  tmp: '>=0.2.6'
  adm-zip: '>=0.6.0'
  fast-uri: '>=3.1.5'
  brace-expansion: '>=2.1.3'
  undici: '>=7.29.0'
  nanoid@^5.0.0: '>=5.1.16'
  uuid: '>=11.1.1'
allowBuilds:
  '@sentry/cli': false
  '@swc/core': true
  cbor-extract: true
  core-js: false
  esbuild: true
  sharp: true
  spawn-sync: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - uuid@11.1.1
  - shell-quote@1.8.4 || 1.8.5
  - tmp@0.2.6
  - esbuild@0.28.1
  - adm-zip@0.6.0
  - fast-uri@3.1.4 || 3.1.5
  - sharp@0.35.0
  - next@16.2.11
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - undici@6.28.0 || 7.29.0
  - js-yaml@4.3.1
  - dompurify@3.4.13
  - nanoid@3.3.17 || 5.1.16
