<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Tour practice tab</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tour practice tab</h1>
      <p>The TabMerger tour opened this tab so you can practice saving a tab without touching your own.</p>
      <p>
        Go back to the TabMerger window to carry on. The tour closes this tab by itself; you can also close it yourself
        at any time.
      </p>
    </main>
  </body>
</html>
