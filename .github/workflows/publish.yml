name: Publish to Stores

on:
  release:
    types: [published]
  # Manual escape hatch. A `release` event can fail to start this workflow for
  # reasons that leave NO trace anywhere — GitHub suppresses triggers for events
  # created by the built-in GITHUB_TOKEN, and nothing is logged when it does. This
  # lets an already-tagged version be published without re-cutting a release.
  #
  # BETA ONLY, deliberately: the stable jobs below require a real `release` event,
  # so a manual run can never reach the production listing by accident.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to the BETA listing (e.g. v3.1.0-beta.2)"
        required: true
        type: string

# Which backend each build talks to. These are PUBLIC values, not secrets: the web app URL,
# the Supabase URL and publishable key are compiled into every build anyone can install, and
# extension IDs are in the store listing URLs. Keeping them here (not in secrets) makes each
# build's target visible in review: beta and stable use DIFFERENT sites and Supabase projects,
# and when both read one shared secret, the stable path silently pointed at the preview project.
#
# BETA: the beta site and its preview Supabase project. Beta builds (Chrome and Firefox) talk
# to it for sign-in, sync, page previews, upgrade links and, on Firefox, updates.
# PROD: the production site and project, for stable builds only.
env:
  BETA_WEB_APP_URL: https://tabmerger-preview.vercel.app
  BETA_SUPABASE_URL: https://xmofzeqcuyenmxgxjtrv.supabase.co
  BETA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jLK5NyMIvyHkBjilsKo44w_hbTpX9TX
  PROD_WEB_APP_URL: https://tabmerger.vercel.app
  PROD_SUPABASE_URL: https://jzgzdaileqxtsudbaouj.supabase.co
  PROD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_KbrObk74eR4VDgYEqx0hcQ_HxuzkoTy
  # Chrome Web Store item IDs (public: they're in the listing URLs, see docs/PUBLISHING.md).
  CHROME_EXTENSION_ID: inmiajapbpafmhjleiebcamfhkfnlgoc
  CHROME_BETA_EXTENSION_ID: nboljhidpjakiohfdkdjkcljdehcapcd

jobs:
  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a release event GITHUB_REF is already the tag; on a manual run it is
          # the default branch, so the tag has to be checked out explicitly.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the ONLY source of truth for the released version: this repo has
      # no @semantic-release/npm plugin, so package.json's version is never bumped
      # and must not be trusted here.
      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # `wxt zip` reads this and maps it through scripts/manifestVersion.ts:
      #   3.1.0        -> version 3.1.0
      #   3.1.0-beta.2 -> version 3.1.0.2 + version_name 3.1.0-beta.2
      # MV3 rejects a prerelease suffix in `version`, so without this export every
      # submission would silently ship package.json's stale version instead.
      - name: Export manifest version
        run: echo "TABMERGER_MANIFEST_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      # ── prerelease → the BETA listing only (separate CWS item, renamed build) ──
      - name: Build and zip Chrome BETA (MV3)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        working-directory: packages/extension
        env:
          VITE_WEB_APP_URL: ${{ env.BETA_WEB_APP_URL }}
          # NOTE the _BETA suffix: on the beta path wxt.config.ts reads
          # `env.CHROME_EXTENSION_ID_BETA`, not CHROME_EXTENSION_ID. Exporting the
          # wrong name fails SILENTLY — `filter(Boolean)` drops the undefined id and
          # the beta build ships with only the dev id in externally_connectable, so
          # the web app can never reach it.
          CHROME_EXTENSION_ID_BETA: ${{ env.CHROME_BETA_EXTENSION_ID }}
          # REQUIRED. .env.beta / .env.production are gitignored, so the runner has
          # NO env files at all — wxt.config.ts's loadEnv() finds nothing and
          # lib/supabase.ts falls back to https://supabase-not-configured.invalid.
          # The extension then builds, installs and runs fine on local IndexedDB
          # while sign-in, sync and AI all silently fail. That fallback exists to
          # stop a module-scope crash in tests and builds; it must never be what
          # ships. Beta builds use the BETA_* project (see the top-level env).
          VITE_SUPABASE_URL: ${{ env.BETA_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.BETA_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm wxt zip -b chrome --mode beta

      - name: Upload Chrome BETA artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-chrome-beta
          # Leading wildcard is load-bearing. WXT derives {{name}} in its
          # artifactTemplate from the PACKAGE name (@tabmerger/extension), stripped
          # to "tabmergerextension" — not "tabmerger". Every path here was written
          # against the wrong prefix and found nothing; `if-no-files-found: error`
          # is what surfaced it.
          # {{version}} also renders the RAW semver (3.1.0-beta.1), not the mapped
          # MV3 manifest version (3.1.0.1), so the real filename is
          # tabmergerextension-beta-3.1.0-beta.1-chrome.zip. Globbed rather than
          # interpolated so a package rename cannot silently break this again.
          path: packages/extension/.output/*-beta-*-chrome.zip
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          if-no-files-found: error

      # Firefox BETA: unlisted, self-distributed (Vercel Blob), not the Chrome beta
      # listing above. Same Supabase wiring as Chrome beta (see that step). Its
      # `gecko.update_url` is built from VITE_WEB_APP_URL, so this must be the site
      # that serves /firefox-beta/updates.json, or installed betas never update.
      # Published by its own job (publish-firefox-beta) so a Firefox failure can't
      # block the Chrome BETA publish.
      - name: Build and zip Firefox BETA
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        working-directory: packages/extension
        env:
          VITE_WEB_APP_URL: ${{ env.BETA_WEB_APP_URL }}
          VITE_SUPABASE_URL: ${{ env.BETA_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.BETA_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm wxt zip -b firefox --mode beta

      - name: Upload Firefox BETA artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-firefox-beta
          # Same {{name}}/{{version}} caveats as the Chrome BETA artifact above —
          # globbed rather than interpolated for the same reason.
          path: packages/extension/.output/*-beta-*-firefox.zip
          include-hidden-files: true
          if-no-files-found: error

      # ── stable → all three stores ──────────────────────────────────────────────
      - name: Build and zip Chrome (MV3)
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        working-directory: packages/extension
        env:
          VITE_WEB_APP_URL: ${{ env.PROD_WEB_APP_URL }}
          CHROME_EXTENSION_ID: ${{ env.CHROME_EXTENSION_ID }}
          # See the beta step above — without these the shipped build cannot reach
          # Supabase and degrades silently to local-only. Stable uses the PROD_* project.
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm wxt zip

      # Firefox and Edge ship the SAME app and need the same backend wiring. Leaving
      # these out here would produce two stores' worth of local-only builds.
      - name: Build and zip Firefox
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        working-directory: packages/extension
        env:
          VITE_WEB_APP_URL: ${{ env.PROD_WEB_APP_URL }}
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm wxt zip -b firefox

      - name: Build and zip Edge
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        working-directory: packages/extension
        env:
          VITE_WEB_APP_URL: ${{ env.PROD_WEB_APP_URL }}
          CHROME_EXTENSION_ID: ${{ env.CHROME_EXTENSION_ID }}
          VITE_SUPABASE_URL: ${{ env.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm wxt zip -b edge

      - name: Upload Chrome artifact
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-chrome
          path: packages/extension/.output/*-${{ steps.version.outputs.version }}-chrome.zip
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Firefox artifact
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-firefox
          path: packages/extension/.output/*-${{ steps.version.outputs.version }}-firefox.zip
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Edge artifact
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-edge
          path: packages/extension/.output/*-${{ steps.version.outputs.version }}-edge.zip
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          if-no-files-found: error

  # Beta goes all the way to PUBLISHED with no human step: it is a SEPARATE CWS
  # item, private to its trusted testers, so a bad beta cannot reach stable users
  # or block the stable item's review queue.
  publish-chrome-beta:
    name: Beta · Chrome Web Store
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-chrome-beta

      # The store allows ONE in-flight submission per item. While one is pending
      # review the package slot is locked — the dashboard greys out "Upload new
      # package" — so an automated beta push lands on a locked item and fails.
      #
      # Newest-build-wins is the right policy for a beta channel, so withdraw the
      # pending submission first. Neither the CLI nor chrome-webstore-upload
      # exposes this, so it is a raw v2 call.
      #
      # COST, deliberately accepted: cancelling sends the next submission to the
      # BACK of the review queue. Betas landing faster than review completes
      # would mean nothing ever reaches testers. Fine at the current cadence;
      # revisit if beta pushes get frequent.
      - name: Cancel any in-flight beta submission
        # Best-effort ONLY. A failure here means "nothing to cancel" or a
        # response shape we did not predict — neither should stop the release.
        # This tolerance must not be extended to the upload step below, which is
        # the real gate and has to fail loudly.
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ env.CHROME_BETA_EXTENSION_ID }}
        run: |
          cat > cancel.mjs <<'EOF'
          const { CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN, PUBLISHER_ID, EXTENSION_ID } = process.env;
          const base = `https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}`;

          const res = await fetch('https://www.googleapis.com/oauth2/v4/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_id: CLIENT_ID,
              client_secret: CLIENT_SECRET,
              refresh_token: REFRESH_TOKEN,
              grant_type: 'refresh_token',
            }),
          });
          const { access_token: token } = await res.json();
          if (!token) {
            console.log('Could not fetch a token; leaving the upload step to report why.');
            process.exit(0);
          }
          const auth = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

          const status = async () => {
            const r = await fetch(`${base}:fetchStatus`, { headers: auth });
            return r.ok ? r.json() : null;
          };

          // Google does not publish the shape of ItemRevisionStatus, so log the whole
          // object instead of cherry-picking field names that could silently come back
          // `undefined` after a schema change. It is small and carries no secrets —
          // state and version identifiers only.
          const describe = (r) => (r ? JSON.stringify(r) : 'none');

          const before = await status();
          // `submittedItemRevisionStatus` is present only while a revision is in
          // flight. Guarding on it means a normal run (nothing pending) makes one
          // read call and stops, instead of firing a cancel at every release.
          if (!before?.submittedItemRevisionStatus) {
            console.log(`No in-flight submission — nothing to cancel. Published: ${describe(before?.publishedItemRevisionStatus)}`);
            process.exit(0);
          }
          // Log WHICH revision is being withdrawn, not just that one was. Cancelling
          // is destructive to a review already in the queue, so the log has to be
          // enough to reconstruct afterwards what was thrown away.
          console.log(`Cancelling in-flight submission: ${describe(before.submittedItemRevisionStatus)}`);
          console.log(`Currently published (unaffected): ${describe(before.publishedItemRevisionStatus)}`);
          if (before.lastAsyncUploadState) {
            console.log(`Last async upload state: ${before.lastAsyncUploadState}`);
          }

          const cancelled = await fetch(`${base}:cancelSubmission`, { method: 'POST', headers: auth });
          console.log(`cancelSubmission -> HTTP ${cancelled.status}`);
          if (!cancelled.ok) {
            console.log(await cancelled.text());
            process.exit(0);
          }

          // Cancellation is not guaranteed to be visible the instant it returns,
          // and uploading into a slot the store still considers locked would
          // fail for a reason that looks nothing like the real cause. Poll until
          // the submitted revision actually clears.
          for (let i = 0; i < 10; i++) {
            await new Promise((r) => setTimeout(r, 3000));
            const now = await status();
            if (!now?.submittedItemRevisionStatus) {
              console.log(`Submission cleared — withdrew ${describe(before.submittedItemRevisionStatus)}`);
              process.exit(0);
            }
          }
          console.log(`Still showing a submitted revision after 30s; continuing anyway. Tried to withdraw ${describe(before.submittedItemRevisionStatus)}`);
          EOF
          node cancel.mjs

      - name: Upload and publish to the beta listing
        # chrome-webstore-upload-cli v4: credentials come from the environment.
        # The --client-id/--client-secret/--refresh-token FLAGS now throw a hard
        # error (source/config.js), they are not merely deprecated.
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Required since chrome-webstore-upload v6 (what cli@4 depends on),
          # which moved to Chrome Web Store API v2. Every v2 endpoint is
          # publishers/{publisherId}/items/{extensionId}, so the publisher is
          # part of the resource name and can no longer be inferred from the
          # extension ID. It is the DEVELOPER ACCOUNT id — the segment after
          # /devconsole/ in the dashboard URL — not an extension id, and it is
          # the same value for the beta and stable items.
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        # NO subcommand — that is what "auto publish" means in this CLI
        # (config.js: `autoPublish: !command`). There is no --auto-publish flag;
        # passing `upload` here would upload and never publish, silently.
        run: |
          # npx, not `pnpm dlx`: this job has no checkout and no pnpm setup.
          # Only the `build` job runs pnpm/action-setup, and every job gets its
          # own runner, so nothing carries over — `pnpm dlx` here exits 127.
          # npx comes with the runner's preinstalled Node, and adding
          # setup-node with `cache: pnpm` is not an option: there is no
          # lockfile on this runner to cache against.
          # Pinned to @4 deliberately — the env-var credentials above and the
          # no-subcommand auto-publish below are both v4 semantics.
          npx --yes chrome-webstore-upload-cli@4 \
            --source *-beta-*-chrome.zip \
            --extension-id ${{ env.CHROME_BETA_EXTENSION_ID }}

  # Firefox BETA — unlisted, self-distributed (not AMO listed), served from our
  # beta site, at $BETA_WEB_APP_URL/firefox-beta/...
  # via Vercel Blob.
  # See packages/shared/src/constants/firefoxBeta.ts for the shared path/file-name
  # contract and packages/extension/scripts/publishFirefoxBeta.ts for the upload.
  #
  # Deliberately INDEPENDENT of every other publish-* job: only `needs: build`,
  # and a Firefox beta signing/upload failure must never fail or block the Chrome
  # BETA publish, the stable release, or the GitHub Release attachment.
  # attach-beta lists it in `needs` only so it waits for the signed .xpi (and so
  # the Actions graph groups the two beta uploads); its `if` requires only the
  # Chrome BETA upload to have succeeded. `continue-on-error: true` on the job is
  # a second layer of the same guarantee.
  publish-firefox-beta:
    name: Beta · Firefox (unlisted, self-hosted)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Same tag the build job used, so the publish script matches the build
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-firefox-beta

      - name: Extract Firefox BETA zip
        run: |
          mkdir -p firefox-beta-src
          unzip *-beta-*-firefox.zip -d firefox-beta-src

      - name: Sign for self-distribution (unlisted)
        run: |
          # npx here (not pnpm dlx) mirrors the stable publish-firefox job below —
          # web-ext needs the EXTRACTED source directory, not the zip, and
          # --channel unlisted is what makes AMO sign without a public listing.
          npx --yes web-ext sign \
            --source-dir firefox-beta-src \
            --artifacts-dir firefox-beta-artifacts \
            --api-key ${{ secrets.FIREFOX_API_KEY }} \
            --api-secret ${{ secrets.FIREFOX_API_SECRET }} \
            --channel unlisted

      # The signed .xpi is the installable Firefox beta; attach-beta adds it to the
      # GitHub Release next to the Chrome BETA zip.
      - name: Upload signed Firefox BETA .xpi
        uses: actions/upload-artifact@v7
        with:
          name: tabmerger-firefox-beta-signed
          path: firefox-beta-artifacts/*.xpi
          if-no-files-found: error

      # web-ext writes the signed file as <name>-<version>.xpi into
      # --artifacts-dir; there is exactly one file there since this job only
      # ever signs a single build.
      - name: Compute Firefox BETA manifest version
        id: ff-version
        working-directory: packages/extension
        env:
          TABMERGER_MANIFEST_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Reuses the SAME semver -> manifest-version mapping wxt.config.ts
          # applies at build time (scripts/manifestVersion.ts) — Firefox's
          # manifest.json version field carries the same offset-major
          # "4.1.0.N" form as Chrome's (see BETA_STORE_MAJOR_OFFSET), so the
          # uploaded .xpi filename / updates.json entry must match exactly what
          # the built manifest.json reports, or Firefox's update check will
          # never consider the new version newer.
          VERSION=$(pnpm exec tsx -e "
            import('./scripts/manifestVersion.ts').then(({ resolveManifestVersion }) => {
              console.log(resolveManifestVersion(process.env.TABMERGER_MANIFEST_VERSION).version);
            });
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish signed .xpi to Vercel Blob + update updates.json
        working-directory: packages/extension
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.FIREFOX_BETA_BLOB_TOKEN }}
        run: |
          XPI=$(ls ../../firefox-beta-artifacts/*.xpi)
          pnpm exec tsx scripts/publishFirefoxBeta.ts \
            "$XPI" \
            "${{ steps.ff-version.outputs.version }}" \
            "$BETA_WEB_APP_URL"

  publish-chrome:
    name: Stable · Chrome Web Store
    needs: build
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-chrome

      - name: Upload to Chrome Web Store (submit for review — publish manually from dashboard)
        # Credentials via env, not flags — see the beta job above. The `upload`
        # subcommand is deliberate and load-bearing: it uploads WITHOUT publishing,
        # so a human presses Publish in the dashboard. Do not remove it to "match"
        # the beta job — that would auto-publish to every stable user.
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Same developer account as the beta item — see the beta job for why
          # this is required at all.
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          # npx + the @4 pin — same reasons as the beta job above.
          npx --yes chrome-webstore-upload-cli@4 upload \
            --source *-chrome.zip \
            --extension-id ${{ env.CHROME_EXTENSION_ID }}

  # STABLE Firefox only — listed AMO submission. The Firefox BETA channel
  # (unlisted, self-distributed via Vercel Blob) is the independent
  # `publish-firefox-beta` job above/below; it is NOT this job with a flag
  # flipped, because "listed" vs "unlisted" is a different `web-ext sign`
  # channel and a completely different distribution path. Edge has no beta
  # concept worth wiring, so it still only runs for a stable release.
  publish-firefox:
    name: Stable · Firefox Add-ons
    needs: build
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-firefox

      - name: Extract Firefox zip
        run: |
          mkdir -p firefox-src
          unzip *-firefox.zip -d firefox-src

      - name: Sign and submit to Firefox Add-ons
        run: |
          # npx, not `pnpm dlx` — no pnpm on this runner either, see the beta job.
          npx --yes web-ext sign \
            --source-dir firefox-src \
            --artifacts-dir artifacts \
            --api-key ${{ secrets.FIREFOX_API_KEY }} \
            --api-secret ${{ secrets.FIREFOX_API_SECRET }} \
            --channel listed

  publish-edge:
    name: Stable · Edge Add-ons
    needs: build
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-edge

      - name: Upload package to Edge Add-ons
        run: |
          UPLOAD_RESPONSE=$(curl -s -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${{ secrets.EDGE_PRODUCT_ID }}/submissions/draft/package" \
            -H "Authorization: Bearer ${{ secrets.EDGE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @$(ls *-edge.zip))
          echo "Upload response: $UPLOAD_RESPONSE"

      - name: Submit for review
        run: |
          curl -s -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${{ secrets.EDGE_PRODUCT_ID }}/submissions" \
            -H "Authorization: Bearer ${{ secrets.EDGE_ACCESS_TOKEN }}"

  # ── Attach each channel's packages to the GitHub Release, one job per lane ──
  # One job per lane (not one job needing every publish job) is what makes the
  # Actions graph draw two groups: jobs are grouped by the jobs they need AND the
  # jobs that need them, so beta = {Chrome BETA, Firefox BETA} → attach-beta and
  # stable = {Chrome, Firefox, Edge} → attach-stable. `--clobber` so a re-run
  # replaces the assets instead of failing on "already exists".
  attach-beta:
    name: Beta · Attach packages to release
    needs: [build, publish-chrome-beta, publish-firefox-beta]
    # `always()` so a Firefox BETA failure (its job is continue-on-error and must
    # never block anything) doesn't skip this job. What's REQUIRED is the build and
    # the Chrome BETA upload; the signed .xpi is attached only if Firefox produced one.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease)
      && needs.build.result == 'success'
      && needs.publish-chrome-beta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-chrome-beta

      - name: Download signed Firefox BETA .xpi (if Firefox signing succeeded)
        id: firefox-xpi
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tabmerger-firefox-beta-signed

      - name: Attach beta packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(*.zip *.xpi)
          if [ "${{ steps.firefox-xpi.outcome }}" != "success" ]; then
            echo "::warning::No signed Firefox BETA .xpi (its job failed or was skipped); attaching the Chrome BETA zip only."
          fi
          gh release upload "${{ inputs.tag || github.ref_name }}" "${files[@]}" --clobber

  attach-stable:
    name: Stable · Attach packages to release
    needs: [build, publish-chrome, publish-firefox, publish-edge]
    # Every stable store upload must have succeeded: attaching packages to a release
    # whose store upload just failed would advertise a version that didn't ship.
    if: >-
      github.event_name == 'release'
      && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-chrome

      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-firefox

      - uses: actions/download-artifact@v8
        with:
          name: tabmerger-edge

      - name: Attach stable packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" *.zip --clobber
