name: CI

# ──────────────────────────────────────────────────────────────────────────────
# Required status checks — wire these up in GitHub repo Settings →
# Branches → master → Branch protection rules → "Require status checks":
#   • Secret Scan          (scan-secrets)
#   • Type Check           (type-check)
#   • Lint                 (lint)
#   • Unit Tests           (unit-tests)
#   • Coverage Delta       (coverage-delta)
#   • Integration Tests    (integration-tests)
#   • E2E Tests            (e2e-extension, e2e-web)
#   • Visual Regression    (visual-regression)   ← non-blocking until snapshots are committed, see note below
#
# dep-audit is intentionally non-blocking (continue-on-error: true) so
# Renovate/Dependabot PRs can still land even with transitive advisories.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - agentic-revamp
      - beta
  pull_request:
    branches:
      - agentic-revamp
      - beta

jobs:
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets and PII
        run: |
          git ls-files | xargs grep -lE \
            'AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk_test_[0-9a-zA-Z]{24,}|whsec_[0-9a-zA-Z]{32,}|sk-ant-[a-zA-Z0-9\-_]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            2>/dev/null && echo "::error::Secret pattern found in repository" && exit 1 || true

          git ls-files | grep -E '^\.env(\.[a-z]+)?$' | grep -v '\.example$' \
            && echo "::error::.env file found in repository" && exit 1 || true

          echo "No secrets found."

  dep-audit:
    name: Dependency Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/shared type-check
      - run: pnpm --filter @tabmerger/extension type-check
      - run: pnpm --filter @tabmerger/web type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/extension lint
      - run: pnpm --filter @tabmerger/web lint

  # ── Gate 1: unit tests + coverage floor (each package's `test` script runs
  # `vitest run`; the ≥80% floor is enforced by vitest.config.ts `thresholds`,
  # which now fails the job itself if any metric drops below 80%). This job
  # additionally uploads coverage-summary.json for the delta check below, and
  # — only on master push — publishes it as the new baseline artifact.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test extension (with coverage)
        run: pnpm --filter @tabmerger/extension test:coverage

      - name: Test web (with coverage)
        run: pnpm --filter @tabmerger/web test -- --coverage

      - name: Upload coverage summaries (for delta comparison)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ github.sha }}
          path: |
            packages/extension/coverage/coverage-summary.json
            packages/web/coverage/coverage-summary.json
          retention-days: 14

      # Baseline for future PRs to diff against — only refreshed on the default
      # branch, so a bad PR can never poison the baseline other PRs compare to.
      # Deliberately NOT refreshed from `beta`: beta carries unreleased work, and
      # letting it move the baseline would let a coverage drop ride into stable
      # unnoticed at promotion time.
      - name: Publish coverage baseline (default branch only)
        if: github.ref == 'refs/heads/agentic-revamp' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: |
            packages/extension/coverage/coverage-summary.json
            packages/web/coverage/coverage-summary.json
          retention-days: 90
          overwrite: true

  # ── Gate 1b: "no significant regression" check — diffs this run's coverage
  # against the latest master baseline artifact. Uses dawidd6/action-download-artifact
  # since actions/download-artifact can't pull artifacts from a different
  # workflow run. Soft-skips (no baseline yet, e.g. first run ever) rather
  # than failing, per scripts/ci/coverage-delta.mjs's own no-op-if-missing behavior.
  coverage-delta:
    name: Coverage Delta
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Download current coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary-${{ github.sha }}
          path: current

      - name: Download baseline coverage from the default branch
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true # ponytail: no baseline yet (e.g. very first run) → coverage-delta.mjs no-ops on missing file
        with:
          workflow: ci.yml
          # Must match the branch that PUBLISHES the baseline in unit-tests above.
          # This said `master`, which does not exist — so the baseline was never
          # found and the delta check silently no-opped on every run.
          branch: agentic-revamp
          name: coverage-baseline
          path: baseline

      - name: Compare extension coverage
        run: |
          node scripts/ci/coverage-delta.mjs \
            baseline/packages/extension/coverage/coverage-summary.json \
            current/packages/extension/coverage/coverage-summary.json \
            2

      - name: Compare web coverage
        run: |
          node scripts/ci/coverage-delta.mjs \
            baseline/packages/web/coverage/coverage-summary.json \
            current/packages/web/coverage/coverage-summary.json \
            2

  # ── Gate 2: integration tests (real IndexedDB round trips) ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/extension test:integration

  # ── Gate 3: E2E — both fixture sets, non-visual specs only (visual specs
  # are split into their own job below so a snapshot mismatch doesn't block
  # on functional E2E and vice versa) ──
  e2e-extension:
    name: E2E Tests (Extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @tabmerger/extension build
      - run: pnpm --filter @tabmerger/extension test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extension-e2e-report
          path: packages/extension/e2e/playwright-report/
          retention-days: 7

  e2e-web:
    name: E2E Tests (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tabmerger/web test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # ponytail: required by e2e/auth.setup.ts's ephemeral-user admin API calls
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: packages/web/playwright-report/
          retention-days: 7

  # ── Gate 4: visual regression — conditional/graceful. Checks whether each
  # package actually has a `test:visual` script AND at least one *.spec.ts
  # under its visual-test path before running, so this job is a silent no-op
  # (not a failure) on branches where the suite hasn't landed yet. Once
  # baseline screenshots (*-snapshots/ dirs) are committed, first real run
  # will fail until baselines are generated with `--update-snapshots` —
  # that's expected, not a bug in this job.
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    # Non-blocking until Linux baselines are committed — exactly what this file's
    # own header has always said this job should be. There are currently no
    # *-snapshots/*-linux.png files, so every run fails with "A snapshot doesn't
    # exist ... writing actual", which would gate the release on a check that
    # cannot pass.
    #
    # Baselines are deliberately NOT generated yet: committing them today would
    # freeze whatever the popup currently looks like as the reference, before
    # anyone has confirmed in a real browser that the drag-and-drop rework looks
    # right. A wrong baseline is worse than no baseline — it turns a visual
    # regression into the expected result.
    #
    # TO RE-ENABLE: generate the baselines on LINUX (they are platform-suffixed;
    # Windows produces -win32.png and font rendering differs), e.g. via the
    # mcr.microsoft.com/playwright container, commit them, then delete this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Detect visual suite
        id: detect
        run: |
          EXT_HAS_VISUAL=false
          WEB_HAS_VISUAL=false
          if grep -q '"test:visual"' packages/extension/package.json && \
             compgen -G "packages/extension/e2e/tests/*.spec.ts" > /dev/null && \
             grep -rl "@visual\|visual.spec" packages/extension/e2e/tests >/dev/null 2>&1; then
            EXT_HAS_VISUAL=true
          fi
          if grep -q '"test:visual"' packages/web/package.json && \
             compgen -G "packages/web/e2e/*.spec.ts" > /dev/null && \
             grep -rl "@visual\|visual.spec" packages/web/e2e >/dev/null 2>&1; then
            WEB_HAS_VISUAL=true
          fi
          echo "ext=$EXT_HAS_VISUAL" >> "$GITHUB_OUTPUT"
          echo "web=$WEB_HAS_VISUAL" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        if: steps.detect.outputs.ext == 'true' || steps.detect.outputs.web == 'true'
        run: |
          [ "${{ steps.detect.outputs.ext }}" = "true" ] && pnpm --filter @tabmerger/extension exec playwright install --with-deps chromium
          [ "${{ steps.detect.outputs.web }}" = "true" ] && pnpm --filter @tabmerger/web exec playwright install --with-deps chromium
          exit 0

      - name: Build extension
        if: steps.detect.outputs.ext == 'true'
        run: pnpm --filter @tabmerger/extension build

      - name: Visual tests (extension)
        if: steps.detect.outputs.ext == 'true'
        run: pnpm --filter @tabmerger/extension test:visual

      - name: Visual tests (web)
        if: steps.detect.outputs.web == 'true'
        run: pnpm --filter @tabmerger/web test:visual
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: No visual suite found
        if: steps.detect.outputs.ext != 'true' && steps.detect.outputs.web != 'true'
        run: echo "No visual regression suite detected in either package — skipping (not a failure)."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: |
            packages/extension/e2e/playwright-report/
            packages/web/playwright-report/
          retention-days: 7

  build-extension:
    name: Build Extension (Chrome MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/extension build

      - name: Check bundle size budget
        run: |
          SIZE=$(du -sb packages/extension/.output/chrome-mv3 | cut -f1)
          BUDGET=2097152
          echo "Bundle size: ${SIZE} bytes (budget: ${BUDGET} bytes / 2 MB)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::Bundle too large: ${SIZE} bytes exceeds 2 MB budget (${BUDGET} bytes)"
            exit 1
          fi
          echo "Bundle OK"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-bundle
          path: packages/extension/.output/chrome-mv3/
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    # ── BETA ONLY (deliberate, temporary) ────────────────────────────────────
    # Releases are currently cut from `beta` and nowhere else, so nothing can
    # reach the PRODUCTION Chrome Web Store listing while the channel is being
    # proven out. Pushes to the default branch still run every gate above; they
    # just never release.
    #
    # `.releaserc.json` deliberately still lists BOTH branches: `beta` is a
    # prerelease branch and computes its version from the last release on the
    # default channel, so removing the default branch from that config would
    # break the beta versioning rather than merely disabling stable.
    #
    # TO RE-ENABLE STABLE: restore the default branch to this condition —
    #   (github.ref == 'refs/heads/agentic-revamp' || github.ref == 'refs/heads/beta')
    # and nothing else needs to change; publish.yml already routes stable vs
    # prerelease off github.event.release.prerelease.
    if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
    # Collapse a burst of merges into one release rather than one submission each.
    # NOT cancel-in-progress: cancelling mid-release can leave a pushed tag with no
    # GitHub Release, which strands the version and blocks the next run.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    needs:
      [
        scan-secrets,
        type-check,
        lint,
        unit-tests,
        coverage-delta,
        integration-tests,
        e2e-extension,
        e2e-web,
        visual-regression,
      ]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Hand the PAT to checkout so it persists as an http.extraheader in
          # .git/config, giving EVERY git command in this job working credentials.
          #
          # This replaced `persist-credentials: false`, which is what semantic-release
          # documents — and which silently broke the release. Without ambient
          # credentials, semantic-release falls back to rewriting the remote URL from
          # GH_TOKEN/GITHUB_TOKEN (lib/get-git-auth-url.js). With BOTH set it builds two
          # candidate URLs, validates each with `git push --dry-run`, and — critically —
          # SWALLOWS the error from each failure (ensureValidAuthUrl returns null). When
          # neither validates it falls through to `return repositoryUrl`, the bare
          # unauthenticated URL. The symptom is a confusing "Invalid username or token"
          # from a `git ls-remote` whose logged URL has no credentials in it at all, and
          # no trace anywhere of why the token was rejected.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fail BEFORE semantic-release runs, not after. Once it has run it has
      # already pushed a tag and cut a GitHub Release; a publish job that then
      # dies on a missing secret strands that version — the tag exists, nothing
      # was submitted, and the next run computes from a release that never
      # shipped. Checking here turns that into a clean, retryable failure.
      - name: Preflight — required publish secrets
        env:
          CHROME_BETA_EXTENSION_ID: ${{ secrets.CHROME_BETA_EXTENSION_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          missing=()
          # Which store item this release targets depends on the branch: `beta`
          # publishes a prerelease to the beta item, everything else to stable.
          if [ "${GITHUB_REF}" = "refs/heads/beta" ]; then
            [ -n "$CHROME_BETA_EXTENSION_ID" ] || missing+=("CHROME_BETA_EXTENSION_ID")
          else
            [ -n "$CHROME_EXTENSION_ID" ] || missing+=("CHROME_EXTENSION_ID")
          fi
          for v in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          # Fine-grained PATs expire (a year at most). Without this check an
          # expired token surfaces as an opaque auth failure inside
          # semantic-release, long after anyone remembers it was time-limited.
          [ -n "$RELEASE_TOKEN" ] || missing+=("RELEASE_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Refusing to release — missing repo secret(s): ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required publish secrets are present."

      - name: Release
        run: pnpm exec semantic-release
        # RELEASE_TOKEN, deliberately NOT the built-in GITHUB_TOKEN. GitHub
        # suppresses workflow triggers for events created by GITHUB_TOKEN — a
        # recursion guard — so the GitHub Release semantic-release creates would
        # fire `release: published` and publish.yml would never start. Nothing
        # fails; the next workflow simply does not run, which is why this cost a
        # release to diagnose. A PAT is not subject to that guard.
        #
        # The flip side: the chore(release) commit this pushes DOES now trigger
        # ci.yml. semantic-release puts [skip ci] in that commit message, which is
        # the only thing preventing an infinite release loop — do not "tidy" it
        # out of the @semantic-release/git message template in .releaserc.json.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
