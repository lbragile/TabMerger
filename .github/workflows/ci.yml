name: CI

# ──────────────────────────────────────────────────────────────────────────────
# Required status checks — wire these up in GitHub repo Settings →
# Branches → master → Branch protection rules → "Require status checks":
#   • Static Checks        (static-checks — secret scan + type-check + lint;
#                            dep-audit runs inside it as a non-blocking step)
#   • Unit Tests           (unit-tests — also runs the coverage-delta compare
#                            as its last steps, same job)
#   • Integration Tests    (integration-tests)
#   • E2E Tests            (e2e-extension, e2e-web)
#   • Build                (build — extension + web, was build-extension/build-web)
#   • Visual Regression    PAUSED — see the visual-regression job below, it no
#                          longer runs and must not be added back as a required
#                          check until it does.
#
# dep-audit is intentionally non-blocking (continue-on-error on that step only)
# so Renovate/Dependabot PRs can still land even with transitive advisories.
# ──────────────────────────────────────────────────────────────────────────────

on:
  # Manual run: every gate runs as usual and, on agentic-revamp, a passing run
  # deploys a web preview even if nothing under packages/web changed. It's the way
  # to get a preview without a web commit. Re-running an OLD run doesn't do the same
  # job — a re-run uses that commit's code, including whatever made it fail.
  #
  # Deliberately NOT filtered by paths-ignore below — a manual run is an explicit
  # request and must always execute every gate.
  workflow_dispatch:
  push:
    branches:
      - agentic-revamp
      - beta
    # Skip the whole workflow when EVERY changed file is docs/agent-memory —
    # this is what most of the ~15-job/~30-billed-minute runs used to burn on a
    # memory-file or markdown-only commit. If a push touches anything else too,
    # the workflow still runs — this only skips genuinely doc-only changes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches:
      - agentic-revamp
      - beta
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"

# Cancel a superseded run for the same ref — except on `beta`. Beta is the
# release branch (see the `release` job below): cancelling a run mid-release
# could kill a run after semantic-release has already pushed a tag but before
# the required gates finish, stranding that version. Every other ref (PRs,
# agentic-revamp) is safe to cancel-and-restart on a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/beta' }}

# CI's web build and web E2E run against the PREVIEW Supabase project, never production:
# the E2E setup creates and deletes throwaway users through the admin API. Public values
# (compiled into every build), so they live here rather than in secrets; they must match
# publish.yml's BETA_SUPABASE_* values.
env:
  PREVIEW_SUPABASE_URL: https://xmofzeqcuyenmxgxjtrv.supabase.co
  PREVIEW_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jLK5NyMIvyHkBjilsKo44w_hbTpX9TX

jobs:
  # ── Static checks: secret scan, dependency audit (non-blocking step),
  # type-check, lint. Merged into one job so they share a single checkout +
  # install instead of four. dep-audit's continue-on-error moved from the job
  # level to the step level — it's the only thing in this job allowed to fail.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets and PII
        run: |
          git ls-files | xargs grep -lE \
            'AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk_test_[0-9a-zA-Z]{24,}|whsec_[0-9a-zA-Z]{32,}|sk-ant-[a-zA-Z0-9\-_]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            2>/dev/null && echo "::error::Secret pattern found in repository" && exit 1 || true

          git ls-files | grep -E '^\.env(\.[a-z]+)?$' | grep -v '\.example$' \
            && echo "::error::.env file found in repository" && exit 1 || true

          echo "No secrets found."

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency Audit (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Type check (shared)
        run: pnpm --filter @tabmerger/shared type-check
      - name: Type check (extension)
        run: pnpm --filter @tabmerger/extension type-check
      - name: Type check (web)
        run: pnpm --filter @tabmerger/web type-check

      - name: Lint (extension)
        run: pnpm --filter @tabmerger/extension lint
      - name: Lint (web)
        run: pnpm --filter @tabmerger/web lint

  # ── Gate 1: unit tests + coverage floor (each package's `test` script runs
  # `vitest run`; the ≥80% floor is enforced by vitest.config.ts `thresholds`,
  # which fails the job itself if any metric drops below 80%). The coverage
  # delta comparison against the default-branch baseline now runs as the last
  # steps of THIS job (folded in from the former separate `coverage-delta`
  # job) — same checkout, same install, and it can read the just-produced
  # coverage-summary.json files straight off disk instead of a same-run
  # artifact upload/download round trip.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test extension (with coverage)
        run: pnpm --filter @tabmerger/extension test:coverage

      - name: Test web (with coverage)
        run: pnpm --filter @tabmerger/web test -- --coverage

      # Repo-level release tooling (scripts/set-release-version.mjs, run by semantic-release)
      - name: Test release scripts
        run: pnpm test:scripts

      # Baseline for future PRs to diff against — only refreshed on the default
      # branch, so a bad PR can never poison the baseline other PRs compare to.
      # Deliberately NOT refreshed from `beta`: beta carries unreleased work, and
      # letting it move the baseline would let a coverage drop ride into stable
      # unnoticed at promotion time.
      - name: Publish coverage baseline (default branch only)
        if: github.ref == 'refs/heads/agentic-revamp' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline
          path: |
            packages/extension/coverage/coverage-summary.json
            packages/web/coverage/coverage-summary.json
          retention-days: 90
          overwrite: true

      # ── Coverage delta — "no significant regression" check. Diffs the
      # coverage just produced above against the latest default-branch
      # baseline artifact. Uses dawidd6/action-download-artifact since
      # actions/download-artifact can't pull artifacts from a different
      # workflow run. Soft-skips (no baseline yet, e.g. first run ever)
      # rather than failing, per scripts/ci/coverage-delta.mjs's own
      # no-op-if-missing behavior.
      - name: Download baseline coverage from the default branch
        uses: dawidd6/action-download-artifact@v25
        continue-on-error: true # no baseline yet (e.g. very first run) → coverage-delta.mjs no-ops on missing file
        with:
          workflow: ci.yml
          # Must match the branch that PUBLISHES the baseline above.
          branch: agentic-revamp
          name: coverage-baseline
          path: baseline

      - name: Compare extension coverage
        run: |
          node scripts/ci/coverage-delta.mjs \
            baseline/packages/extension/coverage/coverage-summary.json \
            packages/extension/coverage/coverage-summary.json \
            2

      - name: Compare web coverage
        run: |
          node scripts/ci/coverage-delta.mjs \
            baseline/packages/web/coverage/coverage-summary.json \
            packages/web/coverage/coverage-summary.json \
            2

  # ── Gate 2: integration tests (real IndexedDB round trips) ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabmerger/extension test:integration

  # ── Gate 3: E2E — both fixture sets, non-visual specs only (visual specs
  # are handled by the paused visual-regression job below) ──
  e2e-extension:
    name: E2E Tests (Extension)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tabmerger/extension exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tabmerger/extension exec playwright install-deps chromium

      - run: pnpm --filter @tabmerger/extension build
      - run: pnpm --filter @tabmerger/extension test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: extension-e2e-report
          path: packages/extension/e2e/playwright-report/
          retention-days: 7

  e2e-web:
    name: E2E Tests (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tabmerger/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tabmerger/web exec playwright install-deps chromium

      - name: Web E2E (preview Supabase project)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.PREVIEW_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          # Required by e2e/auth.setup.ts's throwaway-user admin API calls. It MUST be the
          # preview project's service-role key: a key from another project fails auth, and
          # production's would let CI create users in production.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the PREVIEW_SUPABASE_SERVICE_ROLE_KEY secret (preview project → Settings → API Keys → service_role)."
            exit 1
          fi
          pnpm --filter @tabmerger/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e-report
          path: packages/web/playwright-report/
          retention-days: 7

  # ── Gate 4: visual regression — PAUSED. ──
  #
  # This job is deliberately disabled (`if: false`) rather than deleted, so the
  # detection/build/run logic is ready to go the moment baselines exist. It has
  # been failing every run since there are no *-snapshots/*-linux.png files —
  # every run fails with "A snapshot doesn't exist ... writing actual" — which
  # is wasted runner time even with continue-on-error, since it still checks out,
  # installs, and builds before failing.
  #
  # It has also been removed from every `needs:` list below (release,
  # deploy-web-preview) — it was never a real gate there either, since it always
  # ran with continue-on-error: true, but a `needs:` entry on a job that never
  # runs would leave those jobs waiting on something that's skipped, not merely
  # non-blocking.
  #
  # TO RE-ENABLE: generate baseline screenshots on LINUX (they are
  # platform-suffixed; Windows produces -win32.png and font rendering differs),
  # e.g. via the mcr.microsoft.com/playwright container, commit them, then
  # delete the `if: false` line below and add this job back to the `needs:`
  # lists on `release` and `deploy-web-preview`.
  visual-regression:
    name: Visual Regression (paused)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "Paused until Linux baseline screenshots exist — see the comment on this job in ci.yml."

  # ── Build: extension (Chrome MV3, with bundle-size budget check) + web.
  # Merged from the former build-extension/build-web jobs to share one
  # checkout + install. Artifact name (extension-bundle) is unchanged — the
  # `release` job doesn't consume it directly, but publish.yml re-builds from
  # the tag, so nothing downstream depends on this name; it's kept for
  # debugging failed releases.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build extension (Chrome MV3)
        run: pnpm --filter @tabmerger/extension build

      - name: Check bundle size budget
        run: |
          SIZE=$(du -sb packages/extension/.output/chrome-mv3 | cut -f1)
          BUDGET=2097152
          echo "Bundle size: ${SIZE} bytes (budget: ${BUDGET} bytes / 2 MB)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::Bundle too large: ${SIZE} bytes exceeds 2 MB budget (${BUDGET} bytes)"
            exit 1
          fi
          echo "Bundle OK"

      - uses: actions/upload-artifact@v7
        with:
          name: extension-bundle
          path: packages/extension/.output/chrome-mv3/
          # .output is a DOT directory, and upload-artifact v4.4+ excludes hidden
          # files and anything inside dot-directories by default. Without this the
          # glob matches and the file is then silently filtered out, reported as
          # the identical "No files were found" as a genuinely wrong path.
          include-hidden-files: true
          retention-days: 7

      - name: Build web
        run: pnpm --filter @tabmerger/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.PREVIEW_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # Validates .releaserc.json on every push to a release branch, so a broken release
  # config is a red check rather than a discovery made halfway through cutting a
  # version. --dry-run computes the next version and writes nothing: no tag, no
  # release, no commit.
  #
  # PUSH ONLY. semantic-release (index.js) exits early and successfully on a pull
  # request — BEFORE analyzeCommits — so a PR run only proves the JSON parses and the
  # plugins resolve, and never checks releaseRules. It was a green check that
  # validated almost nothing, and restricting to push also keeps a write token away
  # from PR-triggered runs.
  #
  # Deliberately NOT a dependency of `release` — it would just re-run the same
  # analysis a second time.
  #
  # Kept as its OWN job (not folded into static-checks) on purpose: it's the only
  # static-ish check that needs `contents: write`. Merging it into static-checks
  # would hand that permission to the secret scan / audit / type-check / lint
  # steps too — least privilege wins over saving one more job.
  release-config:
    name: Validate release config (dry run)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needed even though nothing is written. semantic-release's verifyAuth runs
    # `git push --dry-run` before analyzing commits — in dry-run mode too — and this
    # repo's default GITHUB_TOKEN is read-only, so without this it fails with 403
    # "Write access to repository not granted". Scoped to this one job; the
    # workflow-level default stays read-only.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — semantic-release reads the full tag history to work out the
      # last release. A shallow clone makes it think every release is the first one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: semantic-release --dry-run
        env:
          # The built-in token, with the job's contents:write above. The PAT
          # (RELEASE_TOKEN) is only needed for a REAL release — events created by
          # GITHUB_TOKEN don't trigger publish.yml — and is kept out of this job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ── BETA ONLY (deliberate, temporary) ────────────────────────────────────
    # Releases are currently cut from `beta` and nowhere else, so nothing can
    # reach the PRODUCTION Chrome Web Store listing while the channel is being
    # proven out. Pushes to the default branch still run every gate above; they
    # just never release.
    #
    # `.releaserc.json` deliberately still lists BOTH branches: `beta` is a
    # prerelease branch and computes its version from the last release on the
    # default channel, so removing the default branch from that config would
    # break the beta versioning rather than merely disabling stable.
    #
    # TO RE-ENABLE STABLE: restore the default branch to this condition —
    #   (github.ref == 'refs/heads/agentic-revamp' || github.ref == 'refs/heads/beta')
    # and nothing else needs to change; publish.yml already routes stable vs
    # prerelease off github.event.release.prerelease.
    if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
    # Collapse a burst of merges into one release rather than one submission each.
    # NOT cancel-in-progress: cancelling mid-release can leave a pushed tag with no
    # GitHub Release, which strands the version and blocks the next run. This is
    # consistent with the workflow-level `concurrency` above, which also never
    # cancels a run on `beta` — a workflow-level cancel can never reach in and kill
    # this job mid-release either.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # Every gate that must be GREEN before a version number is burned. Once
    # semantic-release runs it has already pushed a tag and cut a GitHub Release;
    # anything that fails after that strands the version — the tag exists, nothing
    # shipped, and the next run computes from a release that never happened.
    #
    # `build` is load-bearing here, not belt-and-braces: publish.yml re-builds the
    # extension from the tag, so a broken build means the release is cut and THEN
    # fails to produce an artifact. Gating on it turns that stranded release into an
    # ordinary red CI run.
    #
    # visual-regression is deliberately NOT listed — it is paused (`if: false`,
    # see that job's comment) and was never a real gate anyway (continue-on-error:
    # true). Listing a job that never runs would leave this job waiting forever.
    needs:
      [
        static-checks,
        unit-tests,
        integration-tests,
        e2e-extension,
        e2e-web,
        build,
      ]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Hand the PAT to checkout so every git command in this job authenticates
          # with it. actions/checkout v6+ stores the persisted credential under
          # $RUNNER_TEMP rather than writing it directly into .git/config (it used
          # to write an http.extraheader there) — that's transparent here: git
          # still picks it up via includeIf, so every git command (including
          # semantic-release's) authenticates exactly as before.
          #
          # This replaced `persist-credentials: false`, which is what semantic-release
          # documents — and which silently broke the release. Without ambient
          # credentials, semantic-release falls back to rewriting the remote URL from
          # GH_TOKEN/GITHUB_TOKEN (lib/get-git-auth-url.js). With BOTH set it builds two
          # candidate URLs, validates each with `git push --dry-run`, and — critically —
          # SWALLOWS the error from each failure (ensureValidAuthUrl returns null). When
          # neither validates it falls through to `return repositoryUrl`, the bare
          # unauthenticated URL. The symptom is a confusing "Invalid username or token"
          # from a `git ls-remote` whose logged URL has no credentials in it at all, and
          # no trace anywhere of why the token was rejected.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fail BEFORE semantic-release runs, not after. Once it has run it has
      # already pushed a tag and cut a GitHub Release; a publish job that then
      # dies on a missing secret strands that version — the tag exists, nothing
      # was submitted, and the next run computes from a release that never
      # shipped. Checking here turns that into a clean, retryable failure.
      - name: Preflight — required publish secrets
        # Only real secrets are checked here. The store item IDs and each build's
        # Supabase URL/publishable key are public and fixed in publish.yml's top-level
        # `env:` (BETA_* vs PROD_*), so they can't go missing from secrets.
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          missing=()
          # CHROME_PUBLISHER_ID is account-scoped like the OAuth trio, so it is
          # needed on both branches. It became mandatory when
          # chrome-webstore-upload-cli@4 picked up chrome-webstore-upload v6,
          # which moved to Chrome Web Store API v2 — every v2 endpoint is
          # publishers/{publisherId}/items/{extensionId}.
          for v in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN CHROME_PUBLISHER_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          # Fine-grained PATs expire (a year at most). Without this check an
          # expired token surfaces as an opaque auth failure inside
          # semantic-release, long after anyone remembers it was time-limited.
          [ -n "$RELEASE_TOKEN" ] || missing+=("RELEASE_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Refusing to release — missing repo secret(s): ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required publish secrets are present."

      - name: Release
        run: pnpm exec semantic-release
        # RELEASE_TOKEN, deliberately NOT the built-in GITHUB_TOKEN. GitHub
        # suppresses workflow triggers for events created by GITHUB_TOKEN — a
        # recursion guard — so the GitHub Release semantic-release creates would
        # fire `release: published` and publish.yml would never start. Nothing
        # fails; the next workflow simply does not run, which is why this cost a
        # release to diagnose. A PAT is not subject to that guard.
        #
        # The flip side: the chore(release) commit this pushes DOES now trigger
        # ci.yml. semantic-release puts [skip ci] in that commit message, which is
        # the only thing preventing an infinite release loop — do not "tidy" it
        # out of the @semantic-release/git message template in .releaserc.json.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Did this push change anything that ships in the web app? Extension-only commits
  # don't need a new web preview. Diffs the push's own range (`before` → sha), so a
  # multi-commit push is judged on all of its commits, not just the last one.
  web-changes:
    name: Detect web changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/agentic-revamp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run is an explicit request for a preview — nothing to diff.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run; deploying a preview."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new branch or a force push has no usable `before` — deploy to be safe.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No comparable previous commit; treating as a web change."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$changed"
          if echo "$changed" | grep -qE '^(packages/web/|packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/deploy-web\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web-affecting changes; skipping the preview."
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # Web preview — only after EVERY CI gate has passed, and only for pushes that
  # touch the web app. Same gate list as `release`, so "CI succeeded" means the
  # same thing for both. Being a job in this run (not a separate workflow_run)
  # means it deploys exactly the commit these gates tested.
  deploy-web-preview:
    name: Deploy web preview
    needs:
      [
        web-changes,
        static-checks,
        unit-tests,
        integration-tests,
        e2e-extension,
        e2e-web,
        build,
      ]
    # success() is explicit on purpose: a custom `if` would otherwise read as
    # replacing the gate check, and this job must never run after a failed gate.
    if: success() && needs.web-changes.outputs.web == 'true'
    # timeout-minutes is not a valid key on a job that calls a reusable workflow
    # via `uses:` (actionlint: only name/uses/with/secrets/needs/if/permissions
    # are allowed here) — the reusable workflow's own job (deploy-web.yml →
    # `preview`) carries the timeout instead.
    # Only the newest preview matters, so a new push cancels an in-flight deploy.
    # Safe for previews only — never do this for a production deploy.
    concurrency:
      group: deploy-web-preview-${{ github.ref }}
      cancel-in-progress: true
    # A reusable workflow can only use the permissions its caller grants.
    # contents:read is for checkout; the deploy needs nothing else from GitHub.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
