name: Lighthouse

# Performance / accessibility / best-practices / SEO scores for the public marketing pages.
# REPORTING ONLY: every assertion in .github/lighthouse/lighthouserc.json is `warn`, so this
# never fails a PR. Lighthouse scores vary run to run; read the report, and promote an
# assertion to `error` only once its threshold has held steady.
#
# Reports stay in the run's artifacts (target: filesystem): nothing is uploaded to
# Lighthouse's public temporary storage. Needs no secrets, so it also runs on fork PRs.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - beta
    paths:
      - "packages/web/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/lighthouse/**"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (marketing pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pull-requests: write` is only for the score comment, and only this job gets it.
    permissions:
      contents: read
      pull-requests: write
    # Public values compiled into every build, the same ones ci.yml's web build uses
    # against the PREVIEW Supabase project (keep in sync with ci.yml's top-level env).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xmofzeqcuyenmxgxjtrv.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jLK5NyMIvyHkBjilsKo44w_hbTpX9TX
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @tabmerger/web build

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        id: lighthouse
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true

      # One sticky comment per PR, edited in place on each push. Same-repo PRs only: fork and
      # Dependabot PRs get a read-only token, so they just keep the artifacts and the
      # run log. Never switch this workflow to `pull_request_target` to lift that.
      - name: Comment scores on the PR
        if: >-
          ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
          && steps.lighthouse.outputs.manifest != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- lighthouse-report -->';
            const runs = JSON.parse(process.env.MANIFEST || '[]').filter((r) => r.isRepresentativeRun);
            const cell = (score) => `${score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴'} ${Math.round(score * 100)}`;
            const rows = runs.map((r) => {
              const s = r.summary;
              return `| \`${new URL(r.url).pathname}\` | ${cell(s.performance)} | ${cell(s.accessibility)} | ${cell(s['best-practices'])} | ${cell(s.seo)} |`;
            });
            const body = [
              marker,
              '### Lighthouse (marketing pages)',
              '',
              '| Page | Performance | Accessibility | Best practices | SEO |',
              '| --- | --- | --- | --- | --- |',
              ...rows,
              '',
              `Report only, it never blocks a merge. Scores vary between runs. [Full reports are in the run's artifacts](${process.env.RUN_URL}).`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
