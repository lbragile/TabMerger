name: Deploy Web Production

# Builds and deploys the web app to Vercel PRODUCTION (https://tabmerger.vercel.app).
# The preview deploy lives in deploy-web.yml and is a separate thing.
#
# TRIGGERS
#   release (published, stable only) — a stable release also publishes the stable
#     extension builds (publish.yml), and those talk to this site (PROD_WEB_APP_URL), so
#     the site ships with them. The release's tag is what gets deployed.
#   workflow_dispatch — a manual deploy from the Actions tab, for web-only changes or
#     catching the site up.
#   Nothing else. Not every push to main: production changes only on a deliberate
#     decision, and the environment below waits for a human approval each time. Never
#     pull_request_target: it would run with secrets on code from a fork.
#
# WHY NOT PROMOTE A PREVIEW DEPLOYMENT: NEXT_PUBLIC_* values are baked into the bundle
# at build time, so a preview build carries the preview Supabase project. Production
# has to be built with Vercel's own Production environment variables, which is what
# `vercel pull --environment=production` loads.
#
# APPROVAL: the `vercel-production` GitHub environment must have required reviewers, so
# the deploy job pauses until the maintainer approves. It also holds the Vercel secrets,
# so no other workflow or branch can read them.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege. `actions: read` is only for the "did CI pass?" lookup below.
permissions:
  contents: read
  actions: read

# One production deploy at a time. Queue rather than cancel: cancelling a deploy halfway
# through `vercel deploy` can leave production on the older build with no clear signal.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  production:
    name: Deploy production to Vercel
    # A prerelease (a beta) must never reach production. Manual runs always pass.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    environment:
      name: vercel-production
      url: https://tabmerger.vercel.app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The CLI reads these directly: they select the project without an
      # interactive `vercel link`, and keep the token out of command lines.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Decide what to deploy and refuse anything unsafe. Runs before the secrets are
      # even checked, so a bad ref fails fast. Untrusted values (tag name) come in
      # through env, never interpolated into the script.
      - name: Choose the ref to deploy
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "release" ]; then
            [ -n "$RELEASE_TAG" ] || { echo "::error::The release event carried no tag name."; exit 1; }
            # The tag, not the branch tip: the site must match the released commit even
            # if main has moved on since.
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            # A manual run deploys the commit the run was started on, and only from
            # main. Without this, "Run workflow" on any branch would ship that branch.
            if [ "$RUN_REF" != "refs/heads/main" ]; then
              echo "::error::Production can only be deployed from main (this run is on $RUN_REF). In 'Run workflow', pick the main branch."
              exit 1
            fi
            echo "ref=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

      # A release already implies green CI (semantic-release runs after every gate). A
      # manual run has no such guarantee, so require that CI succeeded on this exact
      # commit. Queried through the built-in token (actions: read); the `push` event on
      # ci.yml is the run that executes the gates for a commit on main.
      - name: Require a passing CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::The CI workflow has no successful run for commit $SHA. Wait for CI to pass on main (or fix it) before deploying to production."
            exit 1
          fi
          echo "CI succeeded for $SHA."

      - name: Preflight — required Vercel secrets
        run: |
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secret(s) in the vercel-production environment: ${missing[*]}"
            echo "VERCEL_TOKEN: vercel.com → Account Settings → Tokens."
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID: .vercel/project.json after a local 'vercel link'."
            exit 1
          fi

          # Shape checks. Values are masked in logs, so a bad paste is otherwise
          # invisible — and the CLI reports every one of these as the same vague
          # "Could not retrieve Project Settings".
          bad=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!v}"
            case "$val" in *'"'*|*"'"*) bad+=("$v contains quote characters — paste the bare value") ;; esac
            [ "$val" != "$(printf '%s' "$val" | tr -d '[:space:]')" ] && bad+=("$v contains whitespace or a newline")
          done
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) bad+=("VERCEL_PROJECT_ID should start with prj_") ;; esac
          case "$VERCEL_ORG_ID" in prj_*) bad+=("VERCEL_ORG_ID starts with prj_ — the two IDs look swapped") ;; esac
          if [ ${#bad[@]} -gt 0 ]; then
            for b in "${bad[@]}"; do echo "::error::$b"; done
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # `vercel build` runs the project's install command — packages/web/vercel.json
      # sets it to `cd ../.. && pnpm install --frozen-lockfile` — so pnpm and Node
      # must be on this runner.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Pinned: an unpinned CLI can change behaviour between runs without any
      # change in this repo. Keep in step with deploy-web.yml.
      - name: Install Vercel CLI
        run: npm install -g vercel@60.0.1

      # All three commands run from the REPO ROOT, as in deploy-web.yml: the project's
      # Root Directory (packages/web) comes down with `vercel pull`, and running from
      # inside packages/web would resolve it twice.
      #
      # Env vars come from Vercel's own PRODUCTION environment, so anything the web
      # app needs at build time must be set in Vercel → Settings → Environment
      # Variables with "Production" ticked.
      - name: Pull production environment and project settings
        run: |
          vercel pull --yes --environment=production --non-interactive || {
            echo "::error::Vercel could not load the project. The IDs are well-formed, so check that the token's SCOPE is the account that OWNS the project and that both IDs match it (see deploy-web.yml for details)."
            exit 1
          }

      # Same --standalone reason as the preview build: without it, pnpm's symlinked
      # node_modules make the function upload fail with EEXIST.
      - name: Build
        run: vercel build --prod --standalone --non-interactive

      # --prebuilt deploys exactly the output built above. --prod makes it a production
      # deployment and moves the PROJECT's production domain to it — but that domain is
      # an auto-generated name, not tabmerger.vercel.app (see the alias step below).
      - name: Deploy production
        id: deploy
        run: |
          out=$(vercel deploy --prebuilt --prod --non-interactive --format json)
          echo "$out"
          url=$(printf '%s' "$out" | jq -r '.deployment.url // .url // .deploymentUrl // empty' 2>/dev/null || true)
          if [ -z "$url" ]; then
            url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -n 1 || true)
          fi
          if [ -z "$url" ]; then
            echo "::error::The deploy command succeeded, but no URL was found in its output (logged above)."
            exit 1
          fi
          case "$url" in http*) ;; *) url="https://$url" ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # tabmerger.vercel.app is an ALIAS, not a domain registered on the Vercel project, so
      # `--prod` alone leaves it on whatever deployment it was last pointed at. The first
      # run of this workflow deployed correctly and still left the site on a months-old
      # build for exactly that reason. Same mechanism as tabmerger-preview.vercel.app in
      # deploy-web.yml. REQUIRED: the Production environment's NEXT_PUBLIC_APP_URL, the
      # Supabase redirect allow-list and the stable extension builds all use this host.
      - name: Point tabmerger.vercel.app at this deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: tabmerger.vercel.app
        run: |
          vercel alias set "$URL" "$ALIAS" --non-interactive || {
            echo "::error::Deployed to $URL, but couldn't point $ALIAS at it. The token's scope may not own this project. Production is still serving the previous deployment."
            exit 1
          }

      # A green `vercel deploy` only proves the upload worked. Production once sat on a
      # 53-day-old build with nobody noticing, and a stale build was exactly what broke
      # the extension's cross-origin calls (no Access-Control-Allow-Origin on /api/*).
      # So check the live site and fail the job if it is not serving the new code.
      # Retries cover the short delay before the new deployment answers on the domain.
      - name: Verify the live site
        env:
          SITE: https://tabmerger.vercel.app
          # The stable Chrome extension's origin (see docs/PUBLISHING.md).
          EXT_ORIGIN: chrome-extension://inmiajapbpafmhjleiebcamfhkfnlgoc
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          # The commit actually checked out and built (the tag's commit on a release).
          DEPLOY_SHA=$(git rev-parse HEAD)
          retry() {
            for i in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "attempt $i failed; retrying in 10s"
              sleep 10
            done
            return 1
          }

          check_page() { curl --fail --silent --show-error --location --output /dev/null --max-time 20 "$SITE$1"; }

          # The preflight must echo the extension's origin back. A build without the CORS
          # handling in packages/web/proxy.ts answers without the header.
          check_cors() {
            allow=$(curl --silent --show-error --max-time 20 -X OPTIONS "$SITE/api/track" \
              -H "Origin: $EXT_ORIGIN" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" \
              --dump-header - --output /dev/null \
              | tr -d '\r' | grep -i '^access-control-allow-origin:' | sed 's/^[^:]*: *//' | head -n 1)
            if [ "$allow" != "$EXT_ORIGIN" ]; then
              echo "Access-Control-Allow-Origin was '${allow:-<missing>}', expected '$EXT_ORIGIN'"
              return 1
            fi
          }

          ok=1
          retry check_page / || { echo "::error::$SITE/ did not answer 200"; ok=0; }
          retry check_page /privacy || { echo "::error::$SITE/privacy did not answer 200"; ok=0; }
          retry check_cors || { echo "::error::CORS preflight on $SITE/api/track is wrong — production is not serving the current build"; ok=0; }

          {
            echo "### Web production deployed"
            echo ""
            echo "**$SITE**"
            echo ""
            echo "This deployment: ${DEPLOY_URL}"
            echo ""
            echo "Commit: \`${DEPLOY_SHA}\` (ref \`${DEPLOY_REF}\`)"
            echo ""
            [ "$ok" = 1 ] && echo "Live checks: passed (/, /privacy, extension CORS preflight)." || echo "Live checks: FAILED, see the job log."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]
