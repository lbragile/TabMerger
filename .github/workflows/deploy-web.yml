name: Deploy Web Preview

# Every push to agentic-revamp that touches the web app produces a Vercel
# PREVIEW deployment. Nothing here deploys to production.
#
# This replaced a workflow that could never run: it triggered on `master`, which
# doesn't exist in this repo, and would have deployed `--prod` twice per push (once
# on `push`, once on `workflow_run`), the first time before CI had even finished.
#
# CHECK FIRST — possible double deploys: if the Vercel project is connected to
# this repo through Vercel's own Git integration, Vercel already creates a preview
# for every push to a non-production branch, with no Actions involved. Running
# this as well would produce two previews per push. Vercel dashboard → Project →
# Settings → Git shows whether that integration is on.

on:
  push:
    branches: [agentic-revamp]
    # Only when something that ships in the web app changes. Extension-only
    # commits don't need a new preview.
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Only the newest preview for a branch matters, so a new push cancels an
# in-flight one. (Safe for previews; never do this for a production deploy.)
concurrency:
  group: deploy-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview to Vercel
    runs-on: ubuntu-latest
    env:
      # The CLI reads these directly: they select the project without an
      # interactive `vercel link`, and keep the token out of command lines.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Preflight — required Vercel secrets
        run: |
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}"
            echo "VERCEL_TOKEN: vercel.com → Account Settings → Tokens."
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID: .vercel/project.json after a local 'vercel link'."
            exit 1
          fi

      - uses: actions/checkout@v4

      # `vercel build` runs the project's install command — packages/web/vercel.json
      # sets it to `cd ../.. && pnpm install --frozen-lockfile` — so pnpm and Node
      # must be on this runner.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pinned: an unpinned CLI can change behaviour between runs without any
      # change in this repo.
      - name: Install Vercel CLI
        run: npm install -g vercel@60.0.1

      # All three commands run from the REPO ROOT. The Vercel project's Root
      # Directory (packages/web — implied by vercel.json's `cd ../..`) comes down
      # with `vercel pull` and is applied by `vercel build`. Running them from
      # inside packages/web would resolve that root directory twice.
      #
      # Env vars come from Vercel's own PREVIEW environment, not from GitHub
      # secrets, so anything the web app needs at build time must be set in
      # Vercel → Settings → Environment Variables with "Preview" ticked.
      - name: Pull preview environment and project settings
        run: vercel pull --yes --environment=preview --non-interactive

      - name: Build
        run: vercel build --non-interactive

      # --prebuilt deploys exactly the output built above. Without it, Vercel would
      # ignore that build and do its own.
      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --non-interactive)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Web preview deployed"
            echo ""
            echo "$url"
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
