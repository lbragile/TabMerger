name: Deploy Web Preview

# Builds and deploys a Vercel PREVIEW of the web app. Nothing here deploys to
# production.
#
# REUSABLE ONLY — this has no trigger of its own. It is called by the
# `deploy-web-preview` job in ci.yml, which `needs:` every CI gate, so a preview is
# only ever built from a commit that passed CI, and always the exact commit CI
# tested. The "does this push touch the web app?" check also lives there.
#
# Why not a `workflow_run` trigger ("run after CI completes"): workflow_run ignores
# path filters, so every extension-only commit would redeploy the web preview, and
# it checks out the default branch's latest commit rather than the one CI tested
# unless you pin head_sha by hand.
#
# CHECK FIRST — possible double deploys: if the Vercel project is connected to this
# repo through Vercel's own Git integration, Vercel already creates a preview for
# every push to a non-production branch, with no Actions involved — and without
# waiting for CI. Vercel dashboard → Project → Settings → Git shows whether that
# integration is on.

on:
  workflow_call:

jobs:
  preview:
    name: Deploy preview to Vercel
    runs-on: ubuntu-latest
    env:
      # The CLI reads these directly: they select the project without an
      # interactive `vercel link`, and keep the token out of command lines.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Preflight — required Vercel secrets
        run: |
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}"
            echo "VERCEL_TOKEN: vercel.com → Account Settings → Tokens."
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID: .vercel/project.json after a local 'vercel link'."
            exit 1
          fi

          # Shape checks. Values are masked in logs, so a bad paste is otherwise
          # invisible — and the CLI reports every one of these as the same vague
          # "Could not retrieve Project Settings".
          bad=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!v}"
            # Quotes are the usual culprit when copying from .vercel/project.json.
            case "$val" in *'"'*|*"'"*) bad+=("$v contains quote characters — paste the bare value") ;; esac
            [ "$val" != "$(printf '%s' "$val" | tr -d '[:space:]')" ] && bad+=("$v contains whitespace or a newline")
          done
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) bad+=("VERCEL_PROJECT_ID should start with prj_") ;; esac
          case "$VERCEL_ORG_ID" in prj_*) bad+=("VERCEL_ORG_ID starts with prj_ — the two IDs look swapped") ;; esac
          if [ ${#bad[@]} -gt 0 ]; then
            for b in "${bad[@]}"; do echo "::error::$b"; done
            exit 1
          fi

      - uses: actions/checkout@v4

      # `vercel build` runs the project's install command — packages/web/vercel.json
      # sets it to `cd ../.. && pnpm install --frozen-lockfile` — so pnpm and Node
      # must be on this runner.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pinned: an unpinned CLI can change behaviour between runs without any
      # change in this repo.
      - name: Install Vercel CLI
        run: npm install -g vercel@60.0.1

      # All three commands run from the REPO ROOT. The Vercel project's Root
      # Directory (packages/web — implied by vercel.json's `cd ../..`) comes down
      # with `vercel pull` and is applied by `vercel build`. Running them from
      # inside packages/web would resolve that root directory twice.
      #
      # Env vars come from Vercel's own PREVIEW environment, not from GitHub
      # secrets, so anything the web app needs at build time must be set in
      # Vercel → Settings → Environment Variables with "Preview" ticked.
      - name: Pull preview environment and project settings
        run: |
          # The CLI's own message suggests deleting a .vercel directory, which is
          # irrelevant here — CI has none. With the IDs well-formed (checked above),
          # this failure means the token can't reach the project they name.
          vercel pull --yes --environment=preview --non-interactive || {
            echo "::error::Vercel could not load the project. The IDs are well-formed, so check:"
            echo "::error::1) Token SCOPE — this project belongs to a TEAM; a token scoped to a personal account cannot see it (vercel.com → Account Settings → Tokens → Scope column)."
            echo "::error::2) VERCEL_ORG_ID is the TEAM ID (team_…), not a personal Vercel ID."
            echo "::error::3) Both IDs match the project you mean (.vercel/project.json → orgId, projectId)."
            exit 1
          }

      - name: Build
        run: vercel build --non-interactive

      # --prebuilt deploys exactly the output built above. Without it, Vercel would
      # ignore that build and do its own.
      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --non-interactive)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Web preview deployed"
            echo ""
            echo "$url"
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
